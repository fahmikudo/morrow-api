# /etc/nginx/sites-available/<api-site>.conf
#
# Cloudflare terminates TLS (Flexible mode) and the origin serves plain HTTP on
# port 80. The real client IP comes from the host's shared
# /etc/nginx/conf.d/cloudflare.conf.
#
# Serves api.mrrw.my.id; keep the port equal to APP_PORT in
# /opt/morrow-api/.env.
#
# Install:
#   sudo cp deploy/nginx/morrow-api.conf /etc/nginx/sites-available/<api-site>.conf
#   sudo ln -s /etc/nginx/sites-available/<api-site>.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream morrow_api {
    server 127.0.0.1:8990;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mrrw.my.id;

    access_log /var/log/nginx/morrow-api.access.log;
    error_log  /var/log/nginx/morrow-api.error.log;

    # JSON bodies only: attachment bytes go straight from the browser to R2.
    client_max_body_size 10M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://morrow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Literal https: this hop is plain HTTP, but the visitor is on HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
