# Test everything on GitHub, build the image, push it to GHCR, and let the
# server pull it. The server never compiles anything. See DEPLOYMENT.md.
#
# Image tags (docker/metadata-action):
#   sha-<short>   every push to main and every release — what a rollback names
#   edge          the tip of main
#   X.Y.Z, X.Y    a release tag vX.Y.Z
#   latest        a release tag
#
# Only a release tag (v*) deploys. A merge to main publishes the image and stops.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: API (vet, build & test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secondbrain
          POSTGRES_PASSWORD: secondbrain
          POSTGRES_DB: secondbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondbrain -d secondbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The suite creates and drops a throwaway database per test, so the role
      # needs CREATEDB — the postgres image's superuser has it.
      - name: Test
        run: go test ./... -count=1
        env:
          TEST_DATABASE_URL: postgres://secondbrain:secondbrain@127.0.0.1:5432/secondbrain

  deploy-files:
    name: Deploy files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck deploy script
        run: shellcheck -x --severity=warning deploy/deploy.sh

      - name: Validate production compose
        run: |
          dir="$(mktemp -d)"
          cp deploy/docker-compose.yml "$dir/docker-compose.yml"
          cp deploy/.env.example "$dir/.env"
          MORROW_API_IMAGE_TAG=ci docker compose -f "$dir/docker-compose.yml" config --quiet

  build-push:
    name: Build and push image
    needs: [api, deploy-files]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to production
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Holds the SSH secrets; give it Required reviewers for a one-click approval.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing secrets in the production environment:${missing}"
            exit 1
          fi

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Fingerprint is printed so it can be compared with the server:
          #   ssh-keygen -lf ~deploy/.ssh/authorized_keys
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Test SSH access
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" true

      - name: Ship compose file and deploy script
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.DEPLOY_PORT }}" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy/docker-compose.yml deploy/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/morrow-api/"

      - name: Pull and restart
        env:
          TAG: ${{ needs.build-push.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x /opt/morrow-api/deploy.sh && /opt/morrow-api/deploy.sh MORROW_API_IMAGE_TAG '${TAG}' api"

      # Set the API_URL repository variable (Settings → Variables) to
      # https://api.mrrw.my.id. Without it the check is skipped.
      - name: Smoke test
        if: vars.API_URL != ''
        run: curl -fsS --max-time 10 -o /dev/null "${API_URL}/healthz"
        env:
          API_URL: ${{ vars.API_URL }}
